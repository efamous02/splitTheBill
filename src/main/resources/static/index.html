 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receipts</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main>
  <h1>Receipts</h1>
  <div class="padtop">
    <div class="start">
        <button type="button" id="newBtn">New receipt</button>
        <button type="button" class="ghost" id="listBtn">Existing receipts</button>
      </div>
  </div>
  <div class="paper">
 
 
    <div id="list" hidden></div>
 
 
    <div id="body" hidden>
      <form class="add" id="addForm">
        <div class="n"><label for="iname">Item</label><input id="iname" required placeholder="Pizza"></div>
        <div><label for="iqty">Qty</label><input id="iqty" type="number" min="1" value="1" required></div>
        <div><label for="iprice">Price</label><input id="iprice" type="number" min="0" step="0.01" required placeholder="0.00"></div>
        <button type="submit">Add item</button>
      </form>
      <div id="items"></div>
      <div class="totals" id="totals"></div>
    </div>
    <p id="msg" role="alert"></p>
  </div>
  <div class="tear"></div>
</main>
<datalist id="people"></datalist>
 
<script src="js/app.js" defer></script>
</body>
</html>
